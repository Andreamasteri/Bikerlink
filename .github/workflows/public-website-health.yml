name: Public Website Health

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing-and-blog:
    name: Landing and blog are public
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the public website with browser-style GET requests
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            local url="$1"
            local expected="$2"
            local body status
            body=$(mktemp)
            status=$(curl --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 45 \
              --header 'Accept: text/html' --output "$body" --write-out '%{http_code}' "$url")
            test "$status" = "200"
            grep --quiet --ignore-case "$expected" "$body"
          }

          check_page 'https://biker-link.net/' 'BIKER.*LINK'
          check_page 'https://biker-link.net/blog' 'Il blog di BikerLink'
