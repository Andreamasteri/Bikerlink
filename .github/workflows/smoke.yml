name: Smoke Test

on:
  schedule:
    # GitHub cron uses UTC. Runs every 30 minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bikerlink-candidate-smoke
  cancel-in-progress: false

jobs:
  candidate-smoke:
    name: Candidate API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: candidate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Verify smoke configuration
        env:
          BASE_URL: ${{ secrets.SMOKE_CANDIDATE_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_CANDIDATE }}
        run: |
          test -n "$BASE_URL" || { echo "::error::Missing secret SMOKE_CANDIDATE_BASE_URL"; exit 2; }
          test -n "$DATABASE_URL" || { echo "::error::Missing secret DATABASE_URL_CANDIDATE"; exit 2; }
          node -e '
            const u = new URL(process.env.BASE_URL);
            if (u.protocol !== "https:") throw new Error("Candidate smoke requires HTTPS");
            if (!/(staging|candidate)/i.test(u.hostname)) {
              throw new Error("Refusing host without staging/candidate marker: " + u.hostname);
            }
          '

      - name: Install dependencies
        run: npm ci

      - name: Run API smoke
        env:
          BASE_URL: ${{ secrets.SMOKE_CANDIDATE_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_CANDIDATE }}
          SMOKE_ALLOW_PROD: "0"
          SMOKE_CLEANUP_ORPHANS: "1"
          SMOKE_TIMEOUT_MS: "10000"
        run: |
          set -o pipefail
          npx tsx scripts/smoke/run-smoke.ts 2>&1 | tee smoke-report.txt

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_id }}
          path: smoke-report.txt
          if-no-files-found: warn
          retention-days: 14
