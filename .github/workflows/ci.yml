name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    name: Secrets Scan (detect-secrets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The script compares the PR merge-base with main; shallow checkout
          # would force an unrelated full-repository scan.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Scan for secrets
        run: bash scripts/ci-secrets-scan.sh

  ci:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client (Expo)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: AI schema drift check
        run: bash scripts/check-ai-direct-generateobject.sh

      - name: AppSettings raw-write gate
        run: bash scripts/check-appsettings-raw-writes.sh

      - name: Quebracho-bridge deleted-module guard
        run: bash scripts/check-quebracho-bridge-import.sh

      - name: Quebracho-question deleted-module guard
        run: bash scripts/check-quebracho-question-import.sh

      - name: deploy-build.sh step numbering gate
        run: bash scripts/check-deploy-build-step-numbers.sh

  bowie-expo-doctor:
    name: Bowie Terminal — expo-doctor check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: bowie-terminal/package-lock.json

      - name: Install Bowie Terminal dependencies
        working-directory: bowie-terminal
        run: npm ci

      - name: Run expo-doctor (must exit 0)
        working-directory: bowie-terminal
        run: npx expo-doctor
