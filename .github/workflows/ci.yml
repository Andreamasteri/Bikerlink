name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    name: Secrets Scan (detect-secrets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Scan for secrets
        run: bash scripts/ci-secrets-scan.sh --all

  ci:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client (Expo)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: ESLint
        run: npm run lint

      - name: AI schema drift check
        run: bash scripts/check-ai-direct-generateobject.sh

      - name: AppSettings raw-write gate
        run: bash scripts/check-appsettings-raw-writes.sh
