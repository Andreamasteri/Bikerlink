name: Build APK (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: choice
        default: release-apk
        options:
          - release-apk
          - debug-apk
          - diagnostic-apk

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Pin npm
        shell: bash
        run: |
          corepack enable
          corepack prepare npm@10.9.2 --activate
          npm --version | grep -E '^10\.9\.'

      - name: Validate profile
        id: profile
        shell: bash
        run: |
          case "${{ inputs.profile }}" in
            release-apk|debug-apk|diagnostic-apk)
              printf 'value=%s\n' "${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Rejected build profile" >&2
              exit 64
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        shell: bash
        run: |
          eas build --platform android --profile "${{ steps.profile.outputs.value }}" --non-interactive --no-wait --json | tee eas-build.json
