name: Build APK (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: choice
        default: release-apk
        options:
          - release-apk
          - debug-apk
          - diagnostic-apk

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.2 && test "$(npm --version)" = "10.9.2"

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate build profile
        id: profile
        shell: bash
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          case "$REQUESTED_PROFILE" in
            release-apk|debug-apk|diagnostic-apk)
              printf 'profile=%s\n' "$REQUESTED_PROFILE" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "invalid build profile" >&2
              exit 1
              ;;
          esac

      - name: Build APK
        run: eas build --platform android --profile "${{ steps.profile.outputs.profile }}" --non-interactive --no-wait
