name: PR23 validation

on:
  push:
    branches:
      - agent/stabilize-campaigns-db-runtime-ota
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Neon branch guard
        env:
          DATABASE_URL_DEV: postgresql://dev:dev@ep-dev-pooler.eu-central-1.aws.neon.tech/neondb
          DATABASE_URL_PROD: postgresql://prod:prod@ep-prod-pooler.eu-central-1.aws.neon.tech/neondb
          DATABASE_URL: postgresql://dev:dev@ep-dev-pooler.eu-central-1.aws.neon.tech/neondb
          NODE_ENV: development
        run: npm run check:neon-branch

      - name: Server build
        run: npm run server:build

      - name: Expo public config
        run: npx --no-install expo config --type public
