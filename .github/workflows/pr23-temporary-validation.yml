name: PR23 temporary validation

on:
  push:
    branches:
      - agent/stabilize-campaigns-db-runtime-ota
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL_DEV: postgresql://neondb_owner:test@ep-pr23-dev-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
      DATABASE_URL_PROD: postgresql://neondb_owner:test@ep-pr23-prod-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
      DATABASE_URL: postgresql://neondb_owner:test@ep-pr23-dev-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm

      - name: Setup npm
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Neon branch guard
        run: npm run check:neon-branch

      - name: Server build
        run: npm run server:build

      - name: Expo public config
        run: npx --no-install expo config --type public

      - name: Validation marker
        run: echo PR23 targeted validation completed
