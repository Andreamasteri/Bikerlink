[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run server:build"

[deploy]
startCommand = "npm run server:prod"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Deployment trigger: ensure Railway builds the current main tree after the CommonJS audit fix.
