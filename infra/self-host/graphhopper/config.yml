# =============================================================================
# BikerLink — GraphHopper config.yml CONDIVISO (GraphHopper 12)
#
# Questo è l'UNICO file di config: lo usano sia il BUILD (build-regions.sh) sia
# il SERVING (docker-compose.yml), per OGNI gruppo-area. Ciò che cambia per
# gruppo NON è in questo file ma viene passato come env all'entrypoint:
#
#   FILE  → -Ddw.graphhopper.datareader.file   (il .pbf del gruppo, es. /data/grecia.osm.pbf)
#   GRAPH → -Ddw.graphhopper.graph.location    (la graph-cache del gruppo)
#
# I sysprop -Ddw.graphhopper.* sovrascrivono le chiavi qui sotto, quindi i valori
# `datareader.file` e `graph.location` di default servono solo come fallback.
#
# ⚠️ VINCOLO CRITICO GH (script graphhopper.sh): l'entrypoint forza
# graph.location via sysprop. Senza la env GRAPH tutti i gruppi scrivono su
# /data/default-gh e collidono. Vedi infra/self-host/README.md.
#
# DATAACCESS:
#   - SERVING (questo default): MMAP → poco heap, il grafo resta su disco/NVMe.
#   - BUILD: build-regions.sh forza RAM_STORE via JAVA_OPTS
#     (-Ddw.graphhopper.graph.dataaccess.default_type=RAM_STORE) perché l'import
#     è molto più veloce in RAM.
#
# Versione GraphHopper: 12.x (immagine custom da sorgente su Java 25, vedi docker-compose.yml).
# =============================================================================

graphhopper:
  # Valori di default — sovrascritti per-gruppo dalle env FILE/GRAPH.
  datareader.file: /data/area.osm.pbf
  graph.location: /graphhopper/graph-cache

  # ── Profili ────────────────────────────────────────────────────────────────
  # 4 profili, tutti su custom model:
  #   - motorcycle      → moto "curvy" (motorcycle + curvature), accelerato con LM
  #   - motorcycle_fast → moto veloce (motorcycle), accelerato con CH
  #   - car             → auto, CH
  #   - car_fast        → auto veloce, CH
  # I file custom_model_*.json sono quelli BUILT-IN dell'immagine GraphHopper
  # (NON montare volumi custom_models: usiamo solo i preset ufficiali).
  profiles:
    - name: motorcycle
      custom_model_files: [motorcycle.json, curvature.json]
    - name: motorcycle_fast
      custom_model_files: [motorcycle.json]
    - name: car
      custom_model_files: [car.json]
    - name: car_fast
      custom_model_files: [car.json]

  # Contraction Hierarchies (routing veloce, no flessibilità) per i profili "fast".
  profiles_ch:
    - profile: motorcycle_fast
    - profile: car
    - profile: car_fast

  # Landmarks (flessibile, supporta i custom model a runtime) per la moto curvy.
  profiles_lm:
    - profile: motorcycle

  # Encoded values necessari ai custom model sopra (curvatura, classe strada, ecc.).
  graph.encoded_values: car_access, car_average_speed, road_access, track_type, road_class, curvature, surface, road_environment, ferry_speed, max_speed

  # Accesso ai dati del grafo: MMAP in serving (poco heap). In build viene
  # forzato RAM_STORE via JAVA_OPTS da build-regions.sh.
  graph.dataaccess.default_type: MMAP

  # Strade da ignorare in import (non rilevanti per moto/auto): alleggerisce il grafo.
  import.osm.ignored_highways: footway,construction,cycleway,path,steps

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  # Disattiva il request log (verboso, inutile dietro il reverse proxy).
  request_log:
    appenders: []

logging:
  level: WARN
  appenders:
    - type: console
      threshold: INFO
