# =============================================================================
# BikerLink — Self-Host Stack (PC di casa / Ubuntu Server 24.04 LTS)
#
# Servizi base:
#   - postgres   PostgreSQL 16 + PostGIS 3.4   → :5432
#   - redis      Redis 7 Alpine                → :6379
#   - valhalla   Valhalla (motorcycle nativo)  → :8002
#   - pgadmin    pgAdmin 4 (UI DB)             → :5050
#
# Routing "ad aree regionali" (sistema multi-istanza GraphHopper 12):
#   - graphhopper-grecia           → 127.0.0.1:8990
#   - graphhopper-balcani          → 127.0.0.1:8991
#   - graphhopper-est              → 127.0.0.1:8992
#   - graphhopper-iberia           → 127.0.0.1:8993
#   - graphhopper-arco-alpino      → 127.0.0.1:8994
#   - graphhopper-germania-centro  → 127.0.0.1:8995
#   - graphhopper-francia-benelux  → 127.0.0.1:8996
#   - graphhopper-ecuador          → 127.0.0.1:8997
#
# ⚠️ Codici/porte sincronizzati con shared/routing-areas.ts (FONTE DI VERITÀ).
#
# I servizi graphhopper-* sono sotto il profilo "areas": NON partono con un
# semplice `docker compose up -d` (che avvia solo postgres/redis/valhalla/pgadmin).
# Vengono accesi/spenti per nome dal watchdog in base allo stato abilitato:
#     docker compose up -d graphhopper-<codice>
#     docker compose stop  graphhopper-<codice>
# (Specificare il servizio per nome attiva automaticamente il suo profilo.)
#
# Le porte GraphHopper sono bindate su 127.0.0.1: l'accesso pubblico passa SOLO
# dal reverse proxy nginx (expose/nginx-bikerlink.conf, location /areas/<codice>/).
#
# I grafi vanno costruiti PRIMA con ./build-regions.sh (in ${GRAPHS_DIR}).
#
# Variabili lette da .env:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   PGADMIN_EMAIL, PGADMIN_PASSWORD
#   GRAPHS_DIR    cartella host dei grafi (default ./graphs; idealmente su NVMe)
#   DATA_DIR_HOST cartella host dei .pbf  (default ./data)
# =============================================================================

name: bikerlink-selfhost

# Blocco comune a tutte le istanze GraphHopper-area. Le differenze per gruppo
# (porta, cartella grafo, env FILE, heap) sono override nei singoli servizi.
x-gh-area: &gh-area
  # Immagine CUSTOM compilata da sorgente (graphhopper/graphhopper @master HEAD,
  # GraphHopper 12.x) su runtime Java 25 LTS. Costruita sul ThinkCentre, NON su
  # Docker Hub: vive solo in locale (image store del daemon). Lo STESSO ref va
  # usato in build-regions.sh. Rigenerare l'immagine: vedi README.md.
  image: bikerlink/graphhopper:latest
  restart: unless-stopped
  # Override entrypoint: l'immagine usa per default "./graphhopper.sh -c config-example.yml"
  # (path relativo → legge il file bundled car/foot/bike ignorando il nostro mount).
  # Usiamo il path assoluto /graphhopper/config.yml per puntare al nostro config montato.
  # graphhopper.sh, WORKDIR /graphhopper e porta 8989 sono identici all'immagine
  # precedente (israelhikingmap), quindi l'entrypoint resta invariato.
  entrypoint: ["./graphhopper.sh", "-c", "/graphhopper/config.yml"]
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8989/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 10
    start_period: 90s

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bikerlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bikerlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD non impostata - vedi .env}
      POSTGRES_DB: ${POSTGRES_DB:-bikerlink}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bikerlink} -d ${POSTGRES_DB:-bikerlink}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis 7 (cache, code, heartbeat)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bikerlink-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # GraphHopper 12 — istanze per gruppo-area (vedi shared/routing-areas.ts)
  #
  # Pattern comune (<<: *gh-area) + override per gruppo:
  #   - profiles      : ["areas", "<codice>"]  (controllo selettivo dal watchdog)
  #   - ports         : "127.0.0.1:<porta>:8989"
  #   - environment   : FILE=/data/<codice>.osm.pbf, GRAPH=/graphhopper/graph-cache,
  #                     JAVA_OPTS heap (2g piccoli, 4g grandi)
  #   - volumes       : ${GRAPHS_DIR}/<codice> → /graphhopper/graph-cache
  #
  # GRAPH/FILE via env sovrascrivono graph.location/datareader.file del config
  # condiviso (vincolo critico GH: senza GRAPH i grafi collidono su /data/default-gh).
  # ---------------------------------------------------------------------------
  graphhopper-grecia:
    <<: *gh-area
    container_name: bikerlink-gh-grecia
    profiles: ["areas", "grecia"]
    ports:
      - "127.0.0.1:8990:8989"
    environment:
      GRAPH: /graphhopper/graph-cache
      FILE: /data/grecia.osm.pbf
      JAVA_OPTS: ${GH_HEAP_GRECIA:--Xmx2g -Xms512m -XX:+UseG1GC}
    volumes:
      - ${DATA_DIR_HOST:-./data}:/data:ro
      - ./graphhopper/config.yml:/graphhopper/config.yml:ro
      - ${GRAPHS_DIR:-./graphs}/grecia:/graphhopper/graph-cache

  graphhopper-balcani:
    <<: *gh-area
    container_name: bikerlink-gh-balcani
    profiles: ["areas", "balcani"]
    ports:
      - "127.0.0.1:8991:8989"
    environment:
      GRAPH: /graphhopper/graph-cache
      FILE: /data/balcani.osm.pbf
      JAVA_OPTS: ${GH_HEAP_BALCANI:--Xmx2g -Xms512m -XX:+UseG1GC}
    volumes:
      - ${DATA_DIR_HOST:-./data}:/data:ro
      - ./graphhopper/config.yml:/graphhopper/config.yml:ro
      - ${GRAPHS_DIR:-./graphs}/balcani:/graphhopper/graph-cache

  graphhopper-est:
    <<: *gh-area
    container_name: bikerlink-gh-est
    profiles: ["areas", "est"]
    ports:
      - "127.0.0.1:8992:8989"
    environment:
      GRAPH: /graphhopper/graph-cache
      FILE: /data/est.osm.pbf
      JAVA_OPTS: ${GH_HEAP_EST:--Xmx2g -Xms512m -XX:+UseG1GC}
    volumes:
      - ${DATA_DIR_HOST:-./data}:/data:ro
      - ./graphhopper/config.yml:/graphhopper/config.yml:ro
      - ${GRAPHS_DIR:-./graphs}/est:/graphhopper/graph-cache

  graphhopper-iberia:
    <<: *gh-area
    container_name: bikerlink-gh-iberia
    profiles: ["areas", "iberia"]
    ports:
      - "127.0.0.1:8993:8989"
    environment:
      GRAPH: /graphhopper/graph-cache
      FILE: /data/iberia.osm.pbf
      JAVA_OPTS: ${GH_HEAP_IBERIA:--Xmx2g -Xms512m -XX:+UseG1GC}
    volumes:
      - ${DATA_DIR_HOST:-./data}:/data:ro
      - ./graphhopper/config.yml:/graphhopper/config.yml:ro
      - ${GRAPHS_DIR:-./graphs}/iberia:/graphhopper/graph-cache

  graphhopper-arco-alpino:
    <<: *gh-area
    container_name: bikerlink-gh-arco-alpino
    profiles: ["areas", "arco-alpino"]
    ports:
      - "127.0.0.1:8994:8989"
    environment:
      GRAPH: /graphhopper/graph-cache
      FILE: /data/arco-alpino.osm.pbf
      JAVA_OPTS: ${GH_HEAP_ARCO_ALPINO:--Xmx4g -Xms1g -XX:+UseG1GC}
    volumes:
      - ${DATA_DIR_HOST:-./data}:/data:ro
      - ./graphhopper/config.yml:/graphhopper/config.yml:ro
      - ${GRAPHS_DIR:-./graphs}/arco-alpino:/graphhopper/graph-cache

  graphhopper-germania-centro:
    <<: *gh-area
    container_name: bikerlink-gh-germania-centro
    profiles: ["areas", "germania-centro"]
    ports:
      - "127.0.0.1:8995:8989"
    environment:
      GRAPH: /graphhopper/graph-cache
      FILE: /data/germania-centro.osm.pbf
      JAVA_OPTS: ${GH_HEAP_GERMANIA_CENTRO:--Xmx4g -Xms1g -XX:+UseG1GC}
    volumes:
      - ${DATA_DIR_HOST:-./data}:/data:ro
      - ./graphhopper/config.yml:/graphhopper/config.yml:ro
      - ${GRAPHS_DIR:-./graphs}/germania-centro:/graphhopper/graph-cache

  graphhopper-francia-benelux:
    <<: *gh-area
    container_name: bikerlink-gh-francia-benelux
    profiles: ["areas", "francia-benelux"]
    ports:
      - "127.0.0.1:8996:8989"
    environment:
      GRAPH: /graphhopper/graph-cache
      FILE: /data/francia-benelux.osm.pbf
      JAVA_OPTS: ${GH_HEAP_FRANCIA_BENELUX:--Xmx4g -Xms1g -XX:+UseG1GC}
    volumes:
      - ${DATA_DIR_HOST:-./data}:/data:ro
      - ./graphhopper/config.yml:/graphhopper/config.yml:ro
      - ${GRAPHS_DIR:-./graphs}/francia-benelux:/graphhopper/graph-cache

  graphhopper-ecuador:
    <<: *gh-area
    container_name: bikerlink-gh-ecuador
    profiles: ["areas", "ecuador"]
    ports:
      - "127.0.0.1:8997:8989"
    environment:
      GRAPH: /graphhopper/graph-cache
      FILE: /data/ecuador.osm.pbf
      JAVA_OPTS: ${GH_HEAP_ECUADOR:--Xmx2g -Xms512m -XX:+UseG1GC}
    volumes:
      - ${DATA_DIR_HOST:-./data}:/data:ro
      - ./graphhopper/config.yml:/graphhopper/config.yml:ro
      - ${GRAPHS_DIR:-./graphs}/ecuador:/graphhopper/graph-cache

  # ---------------------------------------------------------------------------
  # Valhalla — engine alternativo (motorcycle nativo, fallback robusto)
  # ---------------------------------------------------------------------------
  valhalla:
    image: bikerlink/valhalla:latest
    container_name: bikerlink-valhalla
    restart: unless-stopped
    # L'immagine custom (build da valhalla/valhalla master) NON ha l'entrypoint
    # orchestratore di gis-ops: CMD=/bin/bash. Lanciamo direttamente il server sui
    # tile/config già presenti in ./data (build da build-valhalla-tiles.sh).
    # Le variabili use_tiles_ignore_pbf/serve_tiles/build_* qui sotto erano lette
    # SOLO dall'entrypoint gis-ops: con l'immagine custom sono no-op, ma le teniamo
    # per documentare l'intento del build dei tile (gestito separatamente).
    command: ["valhalla_service", "/custom_files/valhalla.json", "1"]
    ports:
      - "8002:8002"
    environment:
      use_tiles_ignore_pbf: "False"
      serve_tiles: "True"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      force_rebuild: "${VALHALLA_FORCE_REBUILD:-False}"
    volumes:
      - ./data:/custom_files
      - valhalladata:/custom_files/valhalla_tiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180m

  # ---------------------------------------------------------------------------
  # Nominatim 4.4 — geocoding/reverse-geocoding self-hosted (OSM)
  #
  # Prima esecuzione: il container importa il PBF indicato da NOMINATIM_PBF_URL
  # (default: Italy da Geofabrik). L'import richiede 1-3h per l'Italia.
  # Monitorare con:  docker compose logs -f nominatim
  # Una volta terminato l'import, Nominatim risponde su http://127.0.0.1:7070
  #
  # Profilo "nominatim": non parte con `docker compose up -d`.
  # Avvio manuale (DOPO aver letto infra/self-host/setup-nominatim.sh):
  #   docker compose --env-file .env up -d nominatim
  #
  # Variabili opzionali in .env:
  #   NOMINATIM_PBF_URL   URL del PBF da importare (default: italy-latest)
  #   NOMINATIM_REPLICATION_URL  URL aggiornamenti OSM (disabilitato se FREEZE=true)
  # ---------------------------------------------------------------------------
  nominatim:
    image: mediagis/nominatim:5.3
    container_name: bikerlink-nominatim
    restart: unless-stopped
    profiles: ["nominatim"]
    shm_size: "1gb"
    environment:
      # Per usare il file locale invece di un URL remoto:
      #   NOMINATIM_PBF_URL=file:///nominatim_data/valhalla-merged.osm.pbf
      # Il file valhalla-merged.osm.pbf deve essere in DATA_DIR_HOST (montata in /nominatim_data).
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.geofabrik.de/europe/italy-latest.osm.pbf}
      REPLICATION_URL: ${NOMINATIM_REPLICATION_URL:-https://download.geofabrik.de/europe/italy-updates/}
      FREEZE: ${NOMINATIM_FREEZE:-false}
      IMPORT_WIKIPEDIA: "false"
      IMPORT_STYLE: extratags
      NOMINATIM_PASSWORD: ${NOMINATIM_DB_PASSWORD:-nominatim}
    ports:
      - "127.0.0.1:7070:8080"
    volumes:
      - nominatimdata:/var/lib/postgresql/16/main
      # DATA_DIR_HOST montata in sola lettura per accedere al PBF locale (valhalla-merged.osm.pbf).
      # Usare con: NOMINATIM_PBF_URL=file:///nominatim_data/valhalla-merged.osm.pbf
      - ${DATA_DIR_HOST:-./data}:/nominatim_data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8080/status.php' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180m

  # ---------------------------------------------------------------------------
  # Whisper ASR — trascrizione vocale self-hosted (openai-whisper-asr-webservice)
  #
  # Espone /inference (POST multipart) su 127.0.0.1:8080.
  # Il reverse proxy nginx (nginx-bikerlink.conf) lo pubblica su
  # https://whisper.__BASE_DOMAIN__ con autenticazione X-Whisper-Token.
  #
  # Variabili opzionali in .env:
  #   WHISPER_MODEL   modello Whisper (default: small — buon bilanciamento CPU/qualità)
  #                   Valori: tiny | base | small | medium | large-v2
  #   WHISPER_ENGINE  motore ASR (default: faster_whisper — più veloce su CPU)
  #                   Valori: faster_whisper | openai_whisper
  #
  # Prima esecuzione: il container scarica il modello (~500 MB per "small").
  # Monitorare con: docker compose logs -f whisper
  #
  # Profilo "whisper": non parte con `docker compose up -d`.
  # Avvio manuale:
  #   docker compose --env-file .env up -d whisper
  # ---------------------------------------------------------------------------
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: bikerlink-whisper
    restart: unless-stopped
    profiles: ["whisper"]
    environment:
      ASR_MODEL: ${WHISPER_MODEL:-large-v2}
      ASR_ENGINE: ${WHISPER_ENGINE:-faster_whisper}
    ports:
      - "127.0.0.1:8080:9000"
    volumes:
      - whisperdata:/root/.cache/whisper
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ---------------------------------------------------------------------------
  # pgAdmin 4 — UI di amministrazione DB
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bikerlink-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@bikerlink.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD non impostata - vedi .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin

  # ---------------------------------------------------------------------------
  # Uptime Kuma — dashboard di monitoring self-hosted
  #
  # Accesso: http://127.0.0.1:3001 (solo da ThinkCentre o via tunnel)
  # Primo avvio: creare account admin dalla UI.
  #
  # Avvio con il profilo di default:
  #   docker compose up -d uptime-kuma
  # ---------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: bikerlink-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptimekumadata:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node /app/extra/healthcheck.js || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  valhalladata:
  pgadmindata:
  nominatimdata:
  whisperdata:
  uptimekumadata:
