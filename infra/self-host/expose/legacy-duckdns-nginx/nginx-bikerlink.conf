    ssl_trusted_certificate /etc/letsencrypt/live/bikerlink/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        limit_req zone=nominatim_limit burst=20 nodelay;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "__APP_ORIGIN__";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, X-Nominatim-Token, Authorization";
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin "__APP_ORIGIN__" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Nominatim-Token, Authorization" always;

        set $auth_ok   "false";
        set $auth_fail 0;
        if ($http_x_nominatim_token = "__NOMINATIM_TOKEN__")         { set $auth_ok "true"; }
        if ($http_authorization = "Bearer __NOMINATIM_TOKEN__")      { set $auth_ok "true"; }

        if ($auth_ok = "false") {
            set $auth_fail 1;
            return 401 '{"error":"Unauthorized. Provide X-Nominatim-Token header."}';
        }

        proxy_pass http://nominatim_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    access_log /var/log/nginx/nominatim-access.log;
    access_log /var/log/nginx/nominatim-auth-fail.log nominatim_auth_fail if=$auth_fail;
    error_log  /var/log/nginx/nominatim-error.log warn;
}

# -----------------------------------------------------------------------------
# ThinkCentre Agent — https://tc.__BASE_DOMAIN__
# Espone CPU/RAM/uptime del mini-PC al backend Replit (pannello admin).
# Rate limit basso (20 r/m): il pannello admin fa polling raro.
# Auth: header X-Agent-Token oppure Authorization: Bearer <token>
# -----------------------------------------------------------------------------
server {
    listen 192.168.1.35:443 ssl;
    http2 on;
    server_name tc.__BASE_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/bikerlink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikerlink/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bikerlink/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        limit_req zone=tc_limit burst=5 nodelay;

        set $auth_ok   "false";
        set $auth_fail 0;
        if ($http_x_agent_token = "__TC_AGENT_TOKEN__")           { set $auth_ok "true"; }
        if ($http_authorization = "Bearer __TC_AGENT_TOKEN__")    { set $auth_ok "true"; }

        if ($auth_ok = "false") {
            set $auth_fail 1;
            return 401 '{"error":"Unauthorized. Provide X-Agent-Token header."}';
        }

        proxy_pass http://tc_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 8s;
        proxy_connect_timeout 4s;
        proxy_send_timeout 5s;
    }

    access_log /var/log/nginx/tc-access.log;
    access_log /var/log/nginx/tc-auth-fail.log tc_auth_fail if=$auth_fail;
    error_log  /var/log/nginx/tc-error.log warn;
}
