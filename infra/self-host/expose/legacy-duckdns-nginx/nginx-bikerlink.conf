# =============================================================================
# Nginx — Reverse Proxy pubblico per i servizi self-host BikerLink
#
# Espone in HTTPS, con autenticazione a token, i servizi di routing e AI che
# l'app cloud (Replit) deve raggiungere:
#
#   - GraphHopper  127.0.0.1:8989  ->  https://gh.__BASE_DOMAIN__          (X-GH-Token)
#   - Valhalla     127.0.0.1:8002  ->  https://valhalla.__BASE_DOMAIN__    (X-Valhalla-Key)
#   - Ollama       127.0.0.1:11434 ->  https://ollama.__BASE_DOMAIN__      (X-Ollama-Token)
#   - Whisper      127.0.0.1:8080  ->  https://whisper.__BASE_DOMAIN__     (X-Whisper-Token)
#   - Nominatim    127.0.0.1:7070  ->  https://nominatim.__BASE_DOMAIN__   (X-Nominatim-Token)
#
# POSTGRES (:5432) e DRAGONFLY/DragonflyDB (:6379) NON sono esposti qui: restano in ascolto
# solo su localhost / rete privata. NON aggiungere server block per loro.
# Se servono da remoto, usali esclusivamente via VPN (WireGuard/Tailscale).
#
# Segnaposto da sostituire (o generati da setup-expose.sh con `sed`):
#   __BASE_DOMAIN__      es: biker-link.net
#   __GH_TOKEN__         = $GRAPHHOPPER_TOKEN (header X-GH-Token / Bearer)
#   __VALHALLA_KEY__     = $VALHALLA_API_KEY  (header X-Valhalla-Key / Bearer)
#   __OLLAMA_TOKEN__     = $OLLAMA_TOKEN       (header X-Ollama-Token / Bearer)
#   __WHISPER_TOKEN__    = $WHISPER_TOKEN      (header X-Whisper-Token / Bearer)
#   __NOMINATIM_TOKEN__  = $NOMINATIM_TOKEN    (header X-Nominatim-Token / Bearer)
#   __APP_ORIGIN__       origin web autorizzato per CORS, es: https://bikerlink.app
#
# Strategia di ascolto nginx:
#   Tutti i server block usano `listen 192.168.1.35:443 ssl` (IP LAN fisso,
#   non catch-all 0.0.0.0) senza IPv6 `[::]:443`. Questo evita il conflitto
#   con Tailscale (tailscaled si lega a `[::]:443` e `100.91.225.19:443`):
#   se nginx usasse `listen 0.0.0.0:443` o `listen [::]:443 ssl`, il bind
#   fallirebbe e `systemctl restart nginx` non riuscirebbe a ripartire
#   (i vecchi worker sopravvivono con `reload` ma non con `restart`).
#   Il bind su IP specifico (192.168.1.35) garantisce che nginx ascolti
#   sull'interfaccia LAN cablata senza interferire con Tailscale né con
#   qualsiasi altro servizio già su porta 443.
#   La connessione WiFi USB con IP statico è configurata via NetworkManager
#   (profilo "BikerLink-WiFi", vedi setup-wifi-usb.sh) e si attiva
#   automaticamente al boot, garantendo continuità di servizio.
#
# Certificati: un unico SAN cert generato da certbot (Let's Encrypt) per tutti i
# sottodomini. Il flag --cert-name bikerlink garantisce che il lineage si chiami
# sempre "bikerlink" indipendentemente dall'ordine dei -d, così tutti i server
# block puntano allo stesso percorso /etc/letsencrypt/live/bikerlink/.
#
#   sudo certbot certonly --standalone --cert-name bikerlink \
#     -d gh.__BASE_DOMAIN__ -d valhalla.__BASE_DOMAIN__ \
#     -d ollama.__BASE_DOMAIN__ -d whisper.__BASE_DOMAIN__ \
#     -d nominatim.__BASE_DOMAIN__ -d tc.__BASE_DOMAIN__
# =============================================================================

limit_req_zone $binary_remote_addr zone=gh_limit:10m        rate=120r/m;
limit_req_zone $binary_remote_addr zone=valhalla_limit:10m  rate=120r/m;
limit_req_zone $binary_remote_addr zone=ollama_limit:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=whisper_limit:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=nominatim_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=tc_limit:10m        rate=20r/m;
limit_req_status 429;

# -----------------------------------------------------------------------------
# Token masking per i log di auth failure
# Mostra i primi 4 caratteri del token ricevuto seguiti da *** per permettere
# il debug dei 401 senza esporre il token in chiaro nei log.
# -----------------------------------------------------------------------------
map $http_x_gh_token $gh_token_masked {
    default    "-";
    "~^(.{1,4})" "$1***";
}
map $http_x_valhalla_key $valhalla_key_masked {
    default    "-";
    "~^(.{1,4})" "$1***";
}
map $http_x_ollama_token $ollama_token_masked {
    default    "-";
    "~^(.{1,4})" "$1***";
}
map $http_x_whisper_token $whisper_token_masked {
    default    "-";
    "~^(.{1,4})" "$1***";
}
map $http_x_nominatim_token $nominatim_token_masked {
    default    "-";
    "~^(.{1,4})" "$1***";
}
map $http_x_agent_token $agent_token_masked {
    default    "-";
    "~^(.{1,4})" "$1***";
}

# Maschera il Bearer token dall'header Authorization (usato come fallback).
# Formato atteso: "Bearer <token>" — estrae i primi 4 char del token.
# Minimo 1 char nel token affinché la regex abbia priorità sul default "-".
map $http_authorization $auth_bearer_masked {
    default                    "-";
    "~^Bearer\s+(.{1,4})"      "Bearer $1***";
}

# Log format dedicati ai 401 per mismatch token — uno per servizio per
# referenziare la variabile masked specifica del servizio.
# Campi: timestamp | IP | request | header custom mascherato | Authorization mascherata
log_format gh_auth_fail        '$time_iso8601 | $remote_addr | "$request" | x-gh-token=$gh_token_masked | authorization=$auth_bearer_masked';
log_format valhalla_auth_fail  '$time_iso8601 | $remote_addr | "$request" | x-valhalla-key=$valhalla_key_masked | authorization=$auth_bearer_masked';
log_format ollama_auth_fail    '$time_iso8601 | $remote_addr | "$request" | x-ollama-token=$ollama_token_masked | authorization=$auth_bearer_masked';
log_format whisper_auth_fail   '$time_iso8601 | $remote_addr | "$request" | x-whisper-token=$whisper_token_masked | authorization=$auth_bearer_masked';
log_format nominatim_auth_fail '$time_iso8601 | $remote_addr | "$request" | x-nominatim-token=$nominatim_token_masked | authorization=$auth_bearer_masked';
log_format tc_auth_fail        '$time_iso8601 | $remote_addr | "$request" | x-agent-token=$agent_token_masked | authorization=$auth_bearer_masked';

# Routing "ad aree regionali": il path /areas/<codice>/ viene instradato
# all'istanza GraphHopper del gruppo. La mappa codice → 127.0.0.1:porta evita di
# duplicare 7 location identiche (vedi server block gh.__BASE_DOMAIN__).
# ⚠️ Porte sincronizzate con shared/routing-areas.ts e docker-compose.yml.
map $area $gh_target {
    grecia          127.0.0.1:8990;
    balcani         127.0.0.1:8991;
    est             127.0.0.1:8992;
    iberia          127.0.0.1:8993;
    arco-alpino     127.0.0.1:8994;
    germania-centro 127.0.0.1:8995;
    francia-benelux 127.0.0.1:8996;
    ecuador         127.0.0.1:8997;
    default         "";
}

# Servizio metriche aree (docker stats per istanza) — vedi thinkcentre-areas-metrics.py
upstream areas_metrics_backend {
    server 127.0.0.1:9090;
    keepalive 4;
}

# ThinkCentre agent (CPU/RAM/uptime del mini-PC) — vedi thinkcentre-agent/server.js
# NB: porta 9101 occupata da Bacula Director — si usa 9199
upstream tc_agent_backend {
    server 127.0.0.1:9199;
    keepalive 4;
}

upstream valhalla_backend {
    server 127.0.0.1:8002;
    keepalive 16;
}

upstream ollama_backend {
    server 127.0.0.1:11434;
    keepalive 8;
}

upstream whisper_backend {
    server 127.0.0.1:8080;
    keepalive 8;
}

upstream nominatim_backend {
    server 127.0.0.1:7070;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# Redirect HTTP -> HTTPS per tutti i sottodomini
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name gh.__BASE_DOMAIN__ valhalla.__BASE_DOMAIN__ ollama.__BASE_DOMAIN__ whisper.__BASE_DOMAIN__ nominatim.__BASE_DOMAIN__ tc.__BASE_DOMAIN__;
    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# GraphHopper — https://gh.__BASE_DOMAIN__
# -----------------------------------------------------------------------------
server {
    listen 192.168.1.35:443 ssl;
    http2 on;
    server_name gh.__BASE_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/bikerlink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikerlink/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bikerlink/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Routing "ad aree regionali" ──────────────────────────────────────────
    # Ogni gruppo ha la sua istanza GraphHopper su 127.0.0.1:<porta> (vedi map
    # $gh_target). Path pubblico: /areas/<codice>/<endpoint-gh>.
    # Esempio: https://gh.__BASE_DOMAIN__/areas/grecia/route?...
    #
    # NB: il vecchio monolite su :8989 NON esiste più (vedi docker-compose.yml).

    # Health per-area — PUBBLICO, nessun token (uptime monitor + watchdog).
    # Più specifico della location generale: va elencato PRIMA.
    # Es: /areas/grecia/health → http://127.0.0.1:8990/health
    location ~ ^/areas/(?<area>grecia|balcani|est|iberia|arco-alpino|germania-centro|francia-benelux|ecuador)/health$ {
        limit_req zone=gh_limit burst=20 nodelay;
        proxy_pass http://$gh_target/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        proxy_connect_timeout 3s;
    }

    # Routing per-area — protetto da X-GH-Token (stesso token del vecchio monolite).
    # Il prefisso /areas/<codice>/ viene STRIPPATO: $ghpath è il path GraphHopper.
    location ~ ^/areas/(?<area>grecia|balcani|est|iberia|arco-alpino|germania-centro|francia-benelux|ecuador)/(?<ghpath>.*)$ {
        limit_req zone=gh_limit burst=40 nodelay;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "__APP_ORIGIN__";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, X-GH-Token, Authorization";
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin "__APP_ORIGIN__" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-GH-Token, Authorization" always;

        set $auth_ok   "false";
        set $auth_fail 0;
        if ($http_x_gh_token = "__GH_TOKEN__")           { set $auth_ok "true"; }
        if ($http_authorization = "Bearer __GH_TOKEN__") { set $auth_ok "true"; }

        if ($auth_ok = "false") {
            set $auth_fail 1;
            return 401 '{"error":"Unauthorized. Provide X-GH-Token header."}';
        }

        # $gh_target = 127.0.0.1:<porta> dalla map; con variabile in proxy_pass
        # il path NON è auto-inoltrato: lo ricostruiamo da $ghpath + querystring.
        proxy_pass http://$gh_target/$ghpath$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # Metriche aree — protetto da X-GH-Token. JSON con docker stats per istanza.
    # Servito dal collector python su 127.0.0.1:9090 (thinkcentre-areas-metrics.py).
    location /metrics/areas {
        limit_req zone=gh_limit burst=10 nodelay;

        set $auth_ok   "false";
        set $auth_fail 0;
        if ($http_x_gh_token = "__GH_TOKEN__")           { set $auth_ok "true"; }
        if ($http_authorization = "Bearer __GH_TOKEN__") { set $auth_ok "true"; }

        if ($auth_ok = "false") {
            set $auth_fail 1;
            return 401 '{"error":"Unauthorized. Provide X-GH-Token header."}';
        }

        proxy_pass http://areas_metrics_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
    }

    # Catch-all: qualsiasi altro path è invalido in modello multi-area.
    location / {
        return 404 '{"error":"Usa /areas/<codice>/<endpoint>. Codici: grecia,balcani,est,iberia,arco-alpino,germania-centro,francia-benelux,ecuador"}';
    }

    access_log /var/log/nginx/gh-access.log;
    access_log /var/log/nginx/gh-auth-fail.log gh_auth_fail if=$auth_fail;
    error_log  /var/log/nginx/gh-error.log warn;
}

# -----------------------------------------------------------------------------
# Valhalla — https://valhalla.__BASE_DOMAIN__
# -----------------------------------------------------------------------------
server {
    listen 192.168.1.35:443 ssl;
    http2 on;
    server_name valhalla.__BASE_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/bikerlink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikerlink/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bikerlink/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # /status — pubblico, nessun token (health check Valhalla)
    location = /status {
        limit_req zone=valhalla_limit burst=20 nodelay;
        proxy_pass http://valhalla_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        limit_req zone=valhalla_limit burst=40 nodelay;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "__APP_ORIGIN__";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, X-Valhalla-Key, Authorization";
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin "__APP_ORIGIN__" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Valhalla-Key, Authorization" always;

        set $auth_ok   "false";
        set $auth_fail 0;
        if ($http_x_valhalla_key = "__VALHALLA_KEY__")       { set $auth_ok "true"; }
        if ($http_authorization = "Bearer __VALHALLA_KEY__") { set $auth_ok "true"; }

        if ($auth_ok = "false") {
            set $auth_fail 1;
            return 401 '{"error":"Unauthorized. Provide X-Valhalla-Key header."}';
        }

        proxy_pass http://valhalla_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    access_log /var/log/nginx/valhalla-access.log;
    access_log /var/log/nginx/valhalla-auth-fail.log valhalla_auth_fail if=$auth_fail;
    error_log  /var/log/nginx/valhalla-error.log warn;
}

# -----------------------------------------------------------------------------
# Ollama — https://ollama.__BASE_DOMAIN__
# Rate limit conservativo (30 r/m): le chiamate AI sono pesanti, poche al minuto
# -----------------------------------------------------------------------------
server {
    listen 192.168.1.35:443 ssl;
    http2 on;
    server_name ollama.__BASE_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/bikerlink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikerlink/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bikerlink/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        limit_req zone=ollama_limit burst=10 nodelay;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "__APP_ORIGIN__";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, X-Ollama-Token, Authorization";
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin "__APP_ORIGIN__" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Ollama-Token, Authorization" always;

        set $auth_ok   "false";
        set $auth_fail 0;
        if ($http_x_ollama_token = "__OLLAMA_TOKEN__")           { set $auth_ok "true"; }
        if ($http_authorization = "Bearer __OLLAMA_TOKEN__")     { set $auth_ok "true"; }

        if ($auth_ok = "false") {
            set $auth_fail 1;
            return 401 '{"error":"Unauthorized. Provide X-Ollama-Token header."}';
        }

        proxy_pass http://ollama_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Ollama 0.24+ controlla il Host header: ritorna 403 se vede qualcosa
        # di diverso da "localhost"/"127.0.0.1", anche con OLLAMA_ORIGINS=* e
        # token valido. Forzare "localhost" è obbligatorio per evitare 403 silenti.
        # Non passare IP reale: l'auth è già gestita da nginx, Ollama non ne ha
        # bisogno e il log GIN leggeva X-Real-IP come client, creando confusione.
        proxy_set_header Host "localhost";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeout generosi: le risposte LLM possono essere lente (modelli 7-8B)
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Disabilita il buffering per lo streaming token-by-token
        proxy_buffering off;
        proxy_cache off;
        proxy_buffer_size 4k;
    }

    access_log /var/log/nginx/ollama-access.log;
    access_log /var/log/nginx/ollama-auth-fail.log ollama_auth_fail if=$auth_fail;
    error_log  /var/log/nginx/ollama-error.log warn;
}

# -----------------------------------------------------------------------------
# Whisper ASR — https://whisper.__BASE_DOMAIN__
# Rate limit conservativo (30 r/m): trascrizione audio è CPU-intensiva
# -----------------------------------------------------------------------------
server {
    listen 192.168.1.35:443 ssl;
    http2 on;
    server_name whisper.__BASE_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/bikerlink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikerlink/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bikerlink/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Limite dimensione upload audio: 50 MB (clip di pochi minuti a 128kbps)
    client_max_body_size 50M;

    location / {
        limit_req zone=whisper_limit burst=5 nodelay;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "__APP_ORIGIN__";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, X-Whisper-Token, Authorization";
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin "__APP_ORIGIN__" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Whisper-Token, Authorization" always;

        set $auth_ok   "false";
        set $auth_fail 0;
        if ($http_x_whisper_token = "__WHISPER_TOKEN__")         { set $auth_ok "true"; }
        if ($http_authorization = "Bearer __WHISPER_TOKEN__")    { set $auth_ok "true"; }

        if ($auth_ok = "false") {
            set $auth_fail 1;
            return 401 '{"error":"Unauthorized. Provide X-Whisper-Token header."}';
        }

        proxy_pass http://whisper_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeout generosi: la trascrizione di un clip lungo può richiedere > 30s
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    access_log /var/log/nginx/whisper-access.log;
    access_log /var/log/nginx/whisper-auth-fail.log whisper_auth_fail if=$auth_fail;
    error_log  /var/log/nginx/whisper-error.log warn;
}

