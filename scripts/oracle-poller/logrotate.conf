/var/log/oracle-poller.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    # NOTA: owner e gruppo vengono sostituiti da install.sh con l'utente reale
    # (es. "su ubuntu ubuntu"). Il placeholder __POLLER_USER__ non deve restare.
    create 0644 __POLLER_USER__ __POLLER_USER__
    su __POLLER_USER__ __POLLER_USER__
    # Nessun postrotate necessario: lo script usa append (non tiene fd aperto)
}
