# BikerLink — Ollama systemd drop-in: shutdown pulito
# /etc/systemd/system/ollama.service.d/shutdown.conf
#
# Risolve il deadlock cgroup_drain_dying al riavvio del ThinkCentre:
# 1. ExecStop scarica i modelli GPU prima di SIGTERM → GPU libera
# 2. TimeoutStopSec=20s: se il pre-stop fallisce, SIGKILL arriva in 20s
#    (riduce da 75s → 20s la finestra del deadlock cgroup)
# 3. KillMode=control-group: SIGKILL colpisce tutti i thread inclusi quelli GPU
# 4. Delegate=yes: systemd gestisce la gerarchia cgroup in modo più pulito
# 5. OOMPolicy=kill: evita che thread GPU zombie blocchino il cgroup drain
#
# INSTALLAZIONE:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d/
#   sudo cp scripts/thinkcentre/ollama-shutdown.conf \
#       /etc/systemd/system/ollama.service.d/shutdown.conf
#   sudo cp scripts/thinkcentre/ollama-prestop.sh \
#       /etc/systemd/system/ollama.service.d/ollama-prestop.sh
#   sudo chmod +x /etc/systemd/system/ollama.service.d/ollama-prestop.sh
#   sudo systemctl daemon-reload
#
# VERIFICA:
#   systemctl show ollama | grep -E 'TimeoutStop|KillMode|Delegate|OOMPolicy|ExecStop'
#   # Test restart < 15s:
#   time sudo systemctl restart ollama

[Service]
ExecStop=/etc/systemd/system/ollama.service.d/ollama-prestop.sh
TimeoutStopSec=20s
KillMode=control-group
Delegate=yes
OOMPolicy=kill
