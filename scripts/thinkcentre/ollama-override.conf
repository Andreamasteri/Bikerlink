# BikerLink — Ollama systemd drop-in override
# ThinkCentre (i5-7500T, 4 core, 32 GB RAM, Intel HD Graphics 630)
#
# INSTALLAZIONE:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d/
#   sudo cp ollama-override.conf /etc/systemd/system/ollama.service.d/bikerlink.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# VERIFICA:
#   systemctl show ollama | grep -E "Environment|CPUQuota"

[Service]

# ─── Concorrenza ────────────────────────────────────────────────────────────────
# OLLAMA_NUM_PARALLEL=2: massimo 2 richieste AI elaborate in parallelo.
# Con il modello Mistral/Llama 7B (~4 GB in RAM), 2 istanze parallele consumano
# ~8 GB → lascia 4 GB per OS + GraphHopper cache FS.
Environment="OLLAMA_NUM_PARALLEL=2"

# OLLAMA_MAX_LOADED_MODELS=1: un solo modello caricato in RAM alla volta.
# Evita il thrashing quando due modelli diversi vengono richiesti in sequenza.
# Se si usa un solo modello (es. gemma3 o mistral), questo è già il default
# ma renderlo esplicito previene regressioni da aggiornamenti futuri.
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# ─── Threading ──────────────────────────────────────────────────────────────────
# OLLAMA_NUM_THREADS=4: usa tutti e 4 i core fisici per l'inferenza.
# GraphHopper è avviato come processo separato (non come servizio systemd)
# e usa 4 thread di routing → c'è contesa, ma i picchi raramente coincidono.
# Se la latenza di routing degrada sotto carico AI, ridurre a 3.
Environment="OLLAMA_NUM_THREADS=4"

# ─── Flash Attention ────────────────────────────────────────────────────────────
# OLLAMA_FLASH_ATTENTION=1: abilita Flash Attention nel backend llama.cpp.
# Riduce il consumo di memoria VRAM/RAM per la KV-cache e aumenta il throughput
# di token/s soprattutto su context window lunghe (es. chat con storia).
# Compatibile con tutti i modelli GGUF.
Environment="OLLAMA_FLASH_ATTENTION=1"

# ─── GPU integrata Intel HD 630 ─────────────────────────────────────────────────
# L'HD 630 non ha driver Vulkan/CUDA affidabili su Ubuntu; Ollama usa la CPU.
# Disabilitare esplicitamente il tentativo di usare la GPU integrata evita
# che llama.cpp si blocchi su probe falliti e riduce la latenza di avvio.
Environment="OLLAMA_INTEL_GPU=0"

# ─── Limiti di sistema ──────────────────────────────────────────────────────────
# Aumenta il limite di file aperti per evitare errori sotto carico pesante
LimitNOFILE=65536
