# BikerLink — ThinkCentre kernel tuning
# Copia in /etc/sysctl.d/99-bikerlink.conf e ricarica con: sysctl --system

# Minimizza l'uso di swap: RAM è abbondante (32 GB), il swap rallenta GH + Ollama
vm.swappiness = 5

# Dirty page ratio: riduce gli stall di I/O durante i write-back
# dirty_ratio è il limite "bloccante" (processo si ferma a scrivere)
# dirty_background_ratio è il limite "soft" (kworker inizia a fare flush)
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# NOTA — Transparent Huge Pages (THP):
# "kernel.transparent_hugepages" NON è una chiave sysctl valida su Linux.
# THP si configura scrivendo in /sys/kernel/mm/transparent_hugepage/enabled
# (path sysfs, non sysctl). La persistenza al boot è gestita da:
#   - cpu-performance.service (ExecStart include il comando THP)
#   - oppure aggiungendo a /etc/rc.local:
#     echo madvise > /sys/kernel/mm/transparent_hugepage/enabled
# Vedere apply-tuning.sh e docs/thinkcentre-tuning.md per dettagli.

# Aumenta il numero massimo di connessioni TCP in coda (utile sotto carico HTTP da BikerLink)
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# Riduci TIME_WAIT per connessioni HTTP short-lived
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
