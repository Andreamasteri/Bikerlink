# BikerLink — GraphHopper JVM flags ottimizzati per ThinkCentre (i5-7500T, 32 GB RAM)
#
# UTILIZZO:
#   Sostituire il comando di avvio di GraphHopper con quello riportato in fondo a questo file.
#   In alternativa, impostare la variabile d'ambiente JAVA_OPTS con il contenuto di JVM_FLAGS.
#
# MEMORIA:
#   -Xms8g  → heap minimo 8 GB (pre-alloca, evita resize durante warm-up)
#   -Xmx12g → heap massimo 12 GB
#   Lascia ~18 GB disponibili per Ollama (modelli LLM caricati in RAM) + OS + cache FS.
#
# GC — ZGC Generazionale (Java 21+):
#   -XX:+UseZGC              → ZGC: pause sub-millisecondo, ideale per latenza routing
#   -XX:+ZGenerational       → modalità generazionale (Java 21+), throughput +20-40%
#   -XX:+AlwaysPreTouch      → pre-mappa le pagine heap all'avvio → latenza costante a regime
#
# THREADING calibrato su 4 core fisici (i5-7500T):
#   prepare.threads=3  → usato solo durante la fase di prepare (offline, non impatta routing)
#   routing.threads=4  → thread di routing concorrenti (usa tutti i core a regime)
#   -XX:+UseNUMA       → no-op su sistemi single-socket ma non fa male, abilita ottimizzazioni futuro
#
# DIAGNOSTICA (disabilitare in produzione stabile):
#   -verbose:gc        → log GC su stderr (utile per verificare che ZGC sia attivo)

JVM_FLAGS="\
  -Xms8g \
  -Xmx12g \
  -XX:+UseZGC \
  -XX:+ZGenerational \
  -XX:+AlwaysPreTouch \
  -XX:+UseNUMA \
  -XX:+UseTransparentHugePages \
  -XX:+UnlockExperimentalVMOptions \
  -verbose:gc \
"

# ─── NOTA SUI THREAD ────────────────────────────────────────────────────────────
#
# GraphHopper NON usa proprietà JVM (-D...) per configurare i thread.
# Il numero di thread di prepare e routing va impostato in config.yml:
#
#   graphhopper:
#     prepare:
#       threads: 3          ← thread usati durante la fase offline di prepare
#     routing:
#       threads: 4          ← thread di routing concorrenti a regime
#
# Tentare di passarli via -Dgrapher.* o -Dgraphhopper.* non ha effetto.

# ─── COMANDO DI AVVIO COMPLETO ─────────────────────────────────────────────────
#
# Sostituire <VERSION> con la versione di GraphHopper in uso (es. 9.1)
# e <CONFIG> con il path al file config.yml (es. /opt/graphhopper/config.yml).
#
#   java \
#     -Xms8g -Xmx12g \
#     -XX:+UseZGC -XX:+ZGenerational \
#     -XX:+AlwaysPreTouch -XX:+UseNUMA \
#     -XX:+UseTransparentHugePages \
#     -XX:+UnlockExperimentalVMOptions \
#     -jar /opt/graphhopper/graphhopper-web-<VERSION>.jar \
#     server <CONFIG>
#
# ─── CONFIG.YML — sezioni rilevanti (UNICO modo per configurare i thread) ───────
#
# graphhopper:
#   prepare:
#     threads: 3
#   routing:
#     threads: 4
#
# ─────────────────────────────────────────────────────────────────────────────────
