<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSH Terminal — ThinkCentre</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; background: #30363d; }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #e6edf3;
    }

    header .subtitle {
      color: #8b949e;
      font-size: 12px;
      margin-left: auto;
    }

    .main {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 16px 20px;
      gap: 16px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .token-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
    }

    label {
      color: #8b949e;
      font-size: 11px;
      white-space: nowrap;
    }

    input[type="password"], input[type="text"] {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="password"]:focus, input[type="text"]:focus {
      border-color: #58a6ff;
    }

    #tokenInput { width: 320px; }
    #cmdInput { flex: 1; }

    button {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    button:hover { background: #30363d; border-color: #8b949e; }
    button:active { background: #161b22; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    #runBtn {
      background: #238636;
      border-color: #2ea043;
      color: #fff;
    }
    #runBtn:hover { background: #2ea043; }

    .history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-state {
      color: #484f58;
      text-align: center;
      margin-top: 60px;
      font-size: 13px;
    }

    .entry {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }

    .entry-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid #21262d;
      background: #0d1117;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .badge-ok { background: #1a3a2a; color: #3fb950; border: 1px solid #2ea043; }
    .badge-err { background: #3a1a1a; color: #f85149; border: 1px solid #da3633; }
    .badge-run { background: #1a2a3a; color: #58a6ff; border: 1px solid #388bfd; }

    .entry-cmd {
      flex: 1;
      color: #e6edf3;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .entry-meta {
      color: #484f58;
      font-size: 11px;
      white-space: nowrap;
    }

    .entry-body {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .out-block {
      background: #0d1117;
      border-radius: 4px;
      padding: 8px 10px;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 12px;
      max-height: 320px;
      overflow-y: auto;
      line-height: 1.5;
    }

    .out-block.stdout { color: #c9d1d9; }
    .out-block.stderr { color: #f85149; }
    .out-block.empty { color: #484f58; font-style: italic; }

    .out-label {
      font-size: 10px;
      color: #8b949e;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #statusBar {
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 6px 20px;
      font-size: 11px;
      color: #8b949e;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <div class="dot" style="background:#e3b341"></div>
    <div class="dot" style="background:#3fb950"></div>
    <h1>SSH Terminal — ThinkCentre</h1>
    <span class="subtitle" id="hostLabel">host: —</span>
  </header>

  <div class="main">
    <div class="token-row">
      <label for="tokenInput">Token:</label>
      <input type="password" id="tokenInput" placeholder="SSH_EXEC_TOKEN" autocomplete="off" />
      <button id="saveTokenBtn">Salva</button>
      <span id="tokenStatus" style="font-size:11px; color:#8b949e"></span>
    </div>

    <div class="input-row">
      <span style="color:#3fb950; font-size:14px;">$</span>
      <input type="text" id="cmdInput" placeholder="Inserisci un comando..." autocomplete="off" />
      <button id="runBtn" disabled>Esegui</button>
      <button id="clearBtn">Pulisci</button>
    </div>

    <div class="history" id="history">
      <div class="empty-state" id="emptyState">Nessun comando eseguito. Configura il token e digita un comando.</div>
    </div>
  </div>

  <div id="statusBar">Pronto</div>

  <script>
    const tokenInput = document.getElementById('tokenInput');
    const saveTokenBtn = document.getElementById('saveTokenBtn');
    const tokenStatus = document.getElementById('tokenStatus');
    const cmdInput = document.getElementById('cmdInput');
    const runBtn = document.getElementById('runBtn');
    const clearBtn = document.getElementById('clearBtn');
    const history = document.getElementById('history');
    const emptyState = document.getElementById('emptyState');
    const statusBar = document.getElementById('statusBar');
    const hostLabel = document.getElementById('hostLabel');

    let token = localStorage.getItem('ssh_exec_token') || '';
    let running = false;

    function updateTokenState() {
      if (token) {
        tokenInput.value = token;
        tokenStatus.textContent = '✓ salvato';
        tokenStatus.style.color = '#3fb950';
        runBtn.disabled = false;
      } else {
        tokenStatus.textContent = '';
        runBtn.disabled = true;
      }
    }

    saveTokenBtn.addEventListener('click', () => {
      const v = tokenInput.value.trim();
      if (!v) {
        tokenStatus.textContent = 'Token vuoto';
        tokenStatus.style.color = '#f85149';
        return;
      }
      token = v;
      localStorage.setItem('ssh_exec_token', v);
      updateTokenState();
      loadLog();
    });

    tokenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveTokenBtn.click();
    });

    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function renderEntry(entry, prepend) {
      const div = document.createElement('div');
      div.className = 'entry';
      div.dataset.id = entry.id;

      const running = entry.running;
      const ok = entry.exitCode === 0;
      const badgeClass = running ? 'badge-run' : (ok ? 'badge-ok' : 'badge-err');
      const badgeText = running ? '...' : (entry.exitCode === null ? 'ERR' : `exit ${entry.exitCode}`);

      const stdoutTxt = (entry.stdout || '').trim();
      const stderrTxt = (entry.stderr || '').trim();

      div.innerHTML = `
        <div class="entry-header">
          ${running ? '<div class="spinner"></div>' : ''}
          <span class="badge ${badgeClass}">${badgeText}</span>
          <span class="entry-cmd">$ ${escHtml(entry.command)}</span>
          <span class="entry-meta">${entry.timestamp ? formatTime(entry.timestamp) : ''} ${entry.durationMs != null ? `· ${entry.durationMs}ms` : ''}</span>
        </div>
        <div class="entry-body">
          ${stdoutTxt ? `<div><div class="out-label">stdout</div><div class="out-block stdout">${escHtml(stdoutTxt)}</div></div>` : ''}
          ${stderrTxt ? `<div><div class="out-label">stderr</div><div class="out-block stderr">${escHtml(stderrTxt)}</div></div>` : ''}
          ${!stdoutTxt && !stderrTxt && !running ? `<div class="out-block empty">(nessun output)</div>` : ''}
        </div>
      `;

      if (prepend && history.firstChild) {
        history.insertBefore(div, history.firstChild);
      } else {
        history.appendChild(div);
      }
      return div;
    }

    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function setStatus(msg, color) {
      statusBar.textContent = msg;
      statusBar.style.color = color || '#8b949e';
    }

    async function runCommand() {
      const cmd = cmdInput.value.trim();
      if (!cmd || running) return;

      emptyState.style.display = 'none';
      running = true;
      runBtn.disabled = true;
      cmdInput.disabled = true;
      setStatus('Esecuzione in corso…', '#58a6ff');

      const tempEntry = {
        id: 'pending',
        timestamp: new Date().toISOString(),
        command: cmd,
        exitCode: null,
        stdout: '',
        stderr: '',
        durationMs: null,
        running: true,
      };
      const el = renderEntry(tempEntry, true);

      try {
        const res = await fetch('/api/ssh/exec', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-ssh-token': token,
          },
          body: JSON.stringify({ command: cmd }),
        });

        const data = await res.json();

        if (!res.ok) {
          el.remove();
          renderEntry({
            id: data.id || Date.now(),
            timestamp: new Date().toISOString(),
            command: cmd,
            exitCode: null,
            stdout: '',
            stderr: data.error || `HTTP ${res.status}`,
            durationMs: null,
            running: false,
          }, true);
          setStatus(`Errore: ${data.error || res.status}`, '#f85149');
        } else {
          el.remove();
          renderEntry({
            id: data.id,
            timestamp: new Date().toISOString(),
            command: cmd,
            exitCode: data.exitCode,
            stdout: data.stdout,
            stderr: data.stderr,
            durationMs: null,
            running: false,
          }, true);
          setStatus(data.exitCode === 0 ? 'Completato' : `Uscito con codice ${data.exitCode}`, data.exitCode === 0 ? '#3fb950' : '#f85149');
          cmdInput.value = '';
        }
      } catch (err) {
        el.remove();
        renderEntry({
          id: Date.now(),
          timestamp: new Date().toISOString(),
          command: cmd,
          exitCode: null,
          stdout: '',
          stderr: err.message,
          durationMs: null,
          running: false,
        }, true);
        setStatus(`Errore di rete: ${err.message}`, '#f85149');
      } finally {
        running = false;
        runBtn.disabled = !token;
        cmdInput.disabled = false;
        cmdInput.focus();
      }
    }

    async function loadLog() {
      if (!token) return;
      try {
        const res = await fetch('/api/ssh/log', {
          headers: { 'x-ssh-token': token },
        });
        if (!res.ok) return;
        const entries = await res.json();
        history.innerHTML = '';
        if (entries.length === 0) {
          history.appendChild(emptyState);
          emptyState.style.display = '';
          return;
        }
        emptyState.style.display = 'none';
        for (const e of entries) {
          renderEntry(e, false);
        }
        setStatus(`${entries.length} comandi in storico`);
      } catch {}
    }

    runBtn.addEventListener('click', runCommand);
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runCommand();
    });

    clearBtn.addEventListener('click', () => {
      history.innerHTML = '';
      history.appendChild(emptyState);
      emptyState.style.display = '';
      setStatus('Storico pulito (solo visivo — il log server è invariato)');
    });

    const savedHost = localStorage.getItem('ssh_exec_host') || '';
    if (savedHost) hostLabel.textContent = `host: ${savedHost}`;

    updateTokenState();
    if (token) loadLog();
  </script>
</body>
</html>
