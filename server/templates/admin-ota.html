<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>OTA — Admin</title>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#000; color:#eee; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; line-height:1.5; padding:24px 20px 80px; max-width:900px; margin:0 auto; }
  .mono { font-family:"SF Mono","Menlo","Consolas",monospace; }
  h1 { font-size:13px; letter-spacing:3px; text-transform:uppercase; color:#888; font-weight:600; margin-bottom:32px; display:flex; align-items:center; gap:14px; }
  h1 .ref { color:#444; cursor:pointer; font-weight:400; letter-spacing:1px; padding:2px 8px; border:1px solid #222; border-radius:2px; }
  h1 .ref:hover { color:#eee; border-color:#444; }
  section { margin-bottom:40px; }
  .sec-label { font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:#666; margin-bottom:12px; }
  /* Zona 1 — stable */
  .stable-box { background:#0a0a0a; border:1px solid #1e1e1e; border-left:3px solid #22c55e; padding:24px 28px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; }
  .stable-num { font-size:38px; letter-spacing:2px; color:#fff; font-weight:600; }
  .stable-meta { font-size:11px; color:#666; margin-top:6px; }
  .stable-empty { color:#555; font-style:italic; font-size:18px; }
  /* Zona 2 — test slots */
  .slot-row { display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; padding:14px 16px; border:1px solid #1a1a1a; border-radius:2px; margin-bottom:6px; background:#080808; }
  .slot-tag { font-size:10px; letter-spacing:1.5px; color:#888; text-transform:uppercase; min-width:56px; }
  .slot-info { font-size:13px; color:#bbb; }
  .slot-info .num { color:#fff; font-weight:600; margin-right:10px; }
  .slot-info .empty { color:#444; font-style:italic; }
  .slot-actions { display:flex; gap:6px; }
  /* Zona 3 — lista */
  table.releases { width:100%; border-collapse:collapse; }
  table.releases th, table.releases td { padding:9px 12px; text-align:left; border-bottom:1px solid #181818; font-size:12px; }
  table.releases th { color:#666; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; }
  table.releases td.num { color:#fff; font-weight:500; }
  table.releases td.actions { text-align:right; white-space:nowrap; }
  .badge { display:inline-block; font-size:10px; letter-spacing:1px; padding:2px 7px; border-radius:2px; text-transform:uppercase; font-weight:600; }
  .badge.stable { background:#0d2818; color:#22c55e; }
  .badge.test { background:#1e1a08; color:#eab308; }
  .badge.broken { background:#2a0e0e; color:#ef4444; }
  .badge.archived, .badge.draft, .badge.active { background:#161616; color:#777; }
  .badge.previous-stable { background:#0e1a2e; color:#60a5fa; }
  /* Buttons */
  button { font-family:inherit; font-size:11px; letter-spacing:0.5px; padding:7px 12px; border-radius:2px; border:1px solid #2a2a2a; background:#111; color:#ccc; cursor:pointer; transition:all .15s; }
  button:hover { background:#1a1a1a; color:#fff; border-color:#444; }
  button:disabled { opacity:0.35; cursor:not-allowed; }
  button.danger { border-color:#3a1818; color:#f87171; }
  button.danger:hover { background:#2a0e0e; color:#fff; border-color:#ef4444; }
  button.ok { border-color:#143820; color:#4ade80; }
  button.ok:hover { background:#0d2818; color:#fff; border-color:#22c55e; }
  /* Footer log */
  footer { margin-top:60px; padding-top:20px; border-top:1px solid #1a1a1a; text-align:center; }
  footer button { background:transparent; border:none; color:#555; font-size:11px; letter-spacing:1px; padding:8px 16px; }
  footer button:hover { color:#bbb; background:transparent; }
  /* Modal */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:100; }
  .overlay.open { display:flex; }
  .modal { background:#0a0a0a; border:1px solid #222; max-width:1000px; width:100%; padding:24px; border-radius:3px; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
  .modal-head h2 { font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#888; font-weight:600; }
  .modal-head select { background:#111; color:#ccc; border:1px solid #2a2a2a; padding:5px 8px; font-size:11px; font-family:inherit; border-radius:2px; }
  .modal-close { background:transparent; border:none; color:#666; font-size:18px; padding:0 6px; }
  .modal table { width:100%; border-collapse:collapse; font-size:11px; }
  .modal th, .modal td { padding:6px 8px; text-align:left; border-bottom:1px solid #181818; vertical-align:top; }
  .modal th { color:#666; font-size:9px; letter-spacing:1px; text-transform:uppercase; font-weight:600; }
  .modal td.err { color:#aaa; max-width:380px; word-break:break-word; }
  .empty-state { color:#555; font-style:italic; padding:24px; text-align:center; font-size:13px; }
  .error-msg { color:#f87171; padding:12px; background:#1a0a0a; border:1px solid #3a1818; border-radius:2px; margin-bottom:16px; font-size:12px; }
  /* Dropdown for "Testa qui" */
  .test-menu { position:relative; display:inline-block; }
  .test-menu .menu { display:none; position:absolute; right:0; top:100%; background:#0a0a0a; border:1px solid #2a2a2a; min-width:120px; z-index:10; margin-top:2px; }
  .test-menu.open .menu { display:block; }
  .test-menu .menu button { display:block; width:100%; text-align:left; border:none; border-radius:0; background:transparent; padding:8px 12px; }
  .test-menu .menu button:hover { background:#1a1a1a; }
</style>
</head>
<body>

<h1>
  OTA admin
  <span class="ref" id="refresh" title="Aggiorna">⟳</span>
</h1>

<div id="error" class="error-msg" style="display:none"></div>

<section>
  <div class="sec-label">stabile adesso</div>
  <div class="stable-box" id="stable-box">
    <div>
      <div class="stable-num mono" id="stable-num">—</div>
      <div class="stable-meta" id="stable-meta"></div>
    </div>
    <button class="danger" id="revert-btn" disabled>↩ revert</button>
  </div>
</section>

<section>
  <div class="sec-label">in test</div>
  <div id="test-slots"></div>
</section>

<section>
  <div class="sec-label">OTA disponibili</div>
  <table class="releases">
    <thead>
      <tr><th>OTA</th><th>data</th><th>stato</th><th>slot</th><th></th></tr>
    </thead>
    <tbody id="releases-body"></tbody>
  </table>
</section>

<footer>
  <button id="open-log">📋 log</button>
</footer>

<div class="overlay" id="log-overlay">
  <div class="modal">
    <div class="modal-head">
      <h2>ota_events — ultimi 50</h2>
      <div style="display:flex; gap:8px; align-items:center;">
        <select id="phase-filter">
          <option value="">(tutte le phase)</option>
          <option value="server-check">server-check</option>
          <option value="server-anon-check">server-anon-check</option>
          <option value="loaded">loaded</option>
          <option value="check">check</option>
          <option value="admin-assign-slot">admin-assign-slot</option>
          <option value="admin-promote">admin-promote</option>
          <option value="admin-revert">admin-revert</option>
          <option value="admin-mark-broken">admin-mark-broken</option>
          <option value="heartbeat_missing">heartbeat_missing</option>
          <option value="crash">crash</option>
        </select>
        <button id="reload-events">⟳</button>
        <button class="modal-close" id="close-log">✕</button>
      </div>
    </div>
    <div id="events-body"></div>
  </div>
</div>

<script>
(function(){
  var TEST_SLOTS = ['test-1','test-2','test-3'];
  var state = { releases: [], byId: {}, deviceCountBySlot: {} };
  var qs = new URLSearchParams(location.search);
  var myDevice = qs.get('myDevice') || '';

  function $(id){ return document.getElementById(id); }
  function el(tag, attrs, html){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === 'class') e.className = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.substring(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    if (html != null) e.innerHTML = html;
    return e;
  }
  function showError(msg){ var b = $('error'); b.textContent = msg; b.style.display = 'block'; }
  function clearError(){ $('error').style.display = 'none'; }

  function fmtDate(s){
    if (!s) return '—';
    try { var d = new Date(s); return d.toLocaleDateString('it-IT', {day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); } catch(e){ return s; }
  }
  function ago(s){
    if (!s) return 'mai';
    var ms = Date.now() - new Date(s).getTime();
    if (ms < 0) return 'ora';
    var min = Math.floor(ms/60000);
    if (min < 60) return min + 'm fa';
    var h = Math.floor(min/60);
    if (h < 48) return h + 'h fa';
    return Math.floor(h/24) + 'g fa';
  }
  function otaLabel(r){
    if (!r) return '—';
    return r.version || ('OTA-' + (r.id||'').substring(0,6));
  }

  async function api(method, path, body){
    var opts = { method: method, credentials: 'include', headers: {} };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    var r = await fetch(path, opts);
    var txt = await r.text();
    var json = null;
    try { json = txt ? JSON.parse(txt) : null; } catch(e){}
    if (!r.ok) {
      var msg = (json && json.message) || ('HTTP ' + r.status);
      throw new Error(msg);
    }
    return json;
  }

  async function load(){
    clearError();
    try {
      var pair = await Promise.all([
        api('GET', '/api/admin/ota/releases'),
        api('GET', '/api/admin/ota/device-assignments').catch(function(){ return []; })
      ]);
      var rows = pair[0];
      var assignments = pair[1] || [];
      state.releases = rows || [];
      state.byId = {};
      state.releases.forEach(function(r){ state.byId[r.id] = r; });
      state.deviceCountBySlot = {};
      assignments.forEach(function(a){
        var s = a.slot || 'stable';
        state.deviceCountBySlot[s] = (state.deviceCountBySlot[s] || 0) + 1;
      });
      render();
    } catch(e){
      showError('Impossibile caricare le release: ' + e.message);
    }
  }

  function findBySlot(slot){
    return state.releases.find(function(r){ return r.slot === slot; });
  }

  function render(){
    // Zona 1 — stable
    var stable = findBySlot('stable');
    var prev = findBySlot('previous-stable');
    if (stable) {
      $('stable-num').textContent = otaLabel(stable);
      $('stable-meta').textContent = 'pubblicato ' + fmtDate(stable.published_at || stable.created_at) + (prev ? '  ·  precedente: ' + otaLabel(prev) : '');
      $('revert-btn').disabled = !prev;
      $('revert-btn').onclick = function(){ doRevert(stable, prev); };
    } else {
      $('stable-num').innerHTML = '<span class="stable-empty">— nessuno stable —</span>';
      $('stable-meta').textContent = '';
      $('revert-btn').disabled = true;
    }

    // Zona 2 — test slots
    var holder = $('test-slots');
    holder.innerHTML = '';
    TEST_SLOTS.forEach(function(slot){
      var r = findBySlot(slot);
      var row = el('div', {class:'slot-row'});
      row.appendChild(el('div', {class:'slot-tag mono'}, slot));
      var info = el('div', {class:'slot-info'});
      if (r) {
        var dev = state.deviceCountBySlot[slot] || 0;
        info.innerHTML = '<span class="num mono">' + otaLabel(r) + '</span>' +
          '<span style="color:#666">device assegnati: ' + dev + '  ·  ultimo heartbeat: ' + ago(r.last_heartbeat_at) + '</span>';
      } else {
        info.innerHTML = '<span class="empty">— vuoto —</span>';
      }
      row.appendChild(info);
      var actions = el('div', {class:'slot-actions'});
      if (r) {
        var promote = el('button', {class:'ok'}, '✓ promuovi');
        promote.onclick = function(){ doPromote(r, slot); };
        var discard = el('button', {class:'danger'}, '✗ scarta');
        discard.onclick = function(){ doDiscard(r, slot); };
        actions.appendChild(promote);
        actions.appendChild(discard);
      }
      row.appendChild(actions);
      holder.appendChild(row);
    });

    // Zona 3 — lista
    var body = $('releases-body');
    body.innerHTML = '';
    if (!state.releases.length) {
      body.appendChild(el('tr',null,'<td colspan="5" class="empty-state">nessuna release</td>'));
      return;
    }
    state.releases.forEach(function(r){
      var tr = el('tr');
      tr.appendChild(el('td', {class:'num mono'}, otaLabel(r)));
      tr.appendChild(el('td', null, fmtDate(r.published_at || r.created_at)));
      var st = (r.status || 'draft').toLowerCase();
      tr.appendChild(el('td', null, '<span class="badge ' + st + '">' + st + '</span>'));
      var slotLabel = r.slot || '—';
      var slotBadge = slotLabel === 'stable' || slotLabel === 'previous-stable' || /^test-/.test(slotLabel)
        ? '<span class="badge ' + slotLabel + '">' + slotLabel + '</span>'
        : '<span style="color:#555">' + slotLabel + '</span>';
      tr.appendChild(el('td', null, slotBadge));
      var act = el('td', {class:'actions'});
      var isStable = r.slot === 'stable';
      if (!isStable) {
        var menu = el('span', {class:'test-menu'});
        var btn = el('button', null, 'testa qui ▾');
        var menuList = el('div', {class:'menu'});
        TEST_SLOTS.forEach(function(s){
          var b = el('button', null, '→ ' + s);
          b.onclick = function(){ menu.classList.remove('open'); doAssignSlot(r, s); };
          menuList.appendChild(b);
        });
        btn.onclick = function(e){ e.stopPropagation(); document.querySelectorAll('.test-menu.open').forEach(function(m){ if (m!==menu) m.classList.remove('open'); }); menu.classList.toggle('open'); };
        menu.appendChild(btn); menu.appendChild(menuList);
        act.appendChild(menu);
        if (r.status !== 'broken') {
          var bk = el('button', {class:'danger'}, 'marca rotto');
          bk.onclick = function(){ doMarkBroken(r); };
          act.appendChild(bk);
        }
      }
      tr.appendChild(act);
      body.appendChild(tr);
    });
  }

  document.addEventListener('click', function(){
    document.querySelectorAll('.test-menu.open').forEach(function(m){ m.classList.remove('open'); });
  });

  // Confirmations include explicit OTA number per spec.
  function confirmAction(verb, r, extra){
    var lbl = otaLabel(r);
    var msg = verb + '\n\nDigita "' + lbl + '" per confermare' + (extra ? '\n(' + extra + ')' : '') + ':';
    var v = window.prompt(msg, '');
    return v && v.trim() === lbl;
  }

  async function doRevert(stable, prev){
    if (!prev) return;
    if (!confirmAction('REVERT: ' + otaLabel(stable) + ' → ' + otaLabel(prev), stable, 'lo stable corrente verrà sostituito')) return;
    try { await api('POST', '/api/admin/ota/revert', {}); await load(); }
    catch(e){ showError('Revert fallito: ' + e.message); }
  }
  async function doPromote(r, slot){
    if (!confirmAction('PROMUOVI a stable: ' + otaLabel(r), r, 'da slot ' + slot)) return;
    try { await api('POST', '/api/admin/ota/promote', { fromSlot: slot }); await load(); }
    catch(e){ showError('Promote fallito: ' + e.message); }
  }
  async function doDiscard(r, slot){
    if (!confirmAction('SCARTA ' + otaLabel(r), r, 'verrà liberato lo slot ' + slot)) return;
    try { await api('POST', '/api/admin/ota/mark-broken', { releaseId: r.id }); await load(); }
    catch(e){ showError('Scarto fallito: ' + e.message); }
  }
  async function doAssignSlot(r, slot){
    if (!confirmAction('Assegna ' + otaLabel(r) + ' allo slot ' + slot, r)) return;
    try { await api('POST', '/api/admin/ota/assign-slot', { releaseId: r.id, slot: slot }); await load(); }
    catch(e){ showError('Assegnazione fallita: ' + e.message); }
  }
  async function doMarkBroken(r){
    if (!confirmAction('MARCA ROTTO: ' + otaLabel(r), r, 'verrà disattivato definitivamente')) return;
    try { await api('POST', '/api/admin/ota/mark-broken', { releaseId: r.id }); await load(); }
    catch(e){ showError('Mark broken fallito: ' + e.message); }
  }

  // ── Log modal ────────────────────────────────────
  async function loadEvents(){
    var body = $('events-body');
    body.innerHTML = '<div class="empty-state">caricamento…</div>';
    try {
      var phase = $('phase-filter').value;
      var url = '/api/admin/ota/events?limit=50' + (phase ? '&phase=' + encodeURIComponent(phase) : '');
      var rows = await api('GET', url) || [];
      if (!rows.length) { body.innerHTML = '<div class="empty-state">nessun evento</div>'; return; }
      var t = el('table');
      t.innerHTML = '<thead><tr><th>quando</th><th>phase</th><th>source</th><th>release</th><th>error</th></tr></thead>';
      var tb = el('tbody');
      rows.forEach(function(e){
        var tr = el('tr');
        tr.appendChild(el('td', null, fmtDate(e.created_at)));
        tr.appendChild(el('td', {class:'mono'}, e.phase || ''));
        tr.appendChild(el('td', {class:'mono'}, (e.source||'').substring(0,16)));
        tr.appendChild(el('td', {class:'mono'}, (e.release_id||'').substring(0,8)));
        tr.appendChild(el('td', {class:'err'}, (e.error||'').substring(0,200)));
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      body.innerHTML = '';
      body.appendChild(t);
    } catch(e){
      body.innerHTML = '<div class="error-msg">Errore: ' + e.message + '</div>';
    }
  }

  $('refresh').onclick = load;
  $('open-log').onclick = function(){ $('log-overlay').classList.add('open'); loadEvents(); };
  $('close-log').onclick = function(){ $('log-overlay').classList.remove('open'); };
  $('reload-events').onclick = loadEvents;
  $('phase-filter').onchange = loadEvents;
  $('log-overlay').addEventListener('click', function(ev){ if (ev.target === this) this.classList.remove('open'); });

  load();
})();
</script>
</body>
</html>
