# =============================================================================
# Nginx — Reverse Proxy GraphHopper multi-area per BikerLink
#
# Cloudflare Tunnel inoltra gh.__DOMAIN__ a http://127.0.0.1:80.
# Le istanze GraphHopper ascoltano localmente sulle porte 8990-8997:
#   grecia 8990, balcani 8991, est 8992, iberia 8993,
#   arco-alpino 8994, germania-centro 8995, francia-benelux 8996,
#   ecuador 8997.
#
# Il prefisso pubblico /areas/<codice>/ viene rimosso prima del proxy.
# __GH_TOKEN__ viene sostituito dal deploy con GRAPHHOPPER_TOKEN.
# =============================================================================

limit_req_zone $binary_remote_addr zone=gh_limit:10m rate=100r/m;
limit_req_status 429;

map $area $gh_target {
    default              127.0.0.1:8990;
    grecia               127.0.0.1:8990;
    balcani              127.0.0.1:8991;
    est                  127.0.0.1:8992;
    iberia               127.0.0.1:8993;
    arco-alpino          127.0.0.1:8994;
    germania-centro      127.0.0.1:8995;
    francia-benelux      127.0.0.1:8996;
    ecuador              127.0.0.1:8997;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ _;

    add_header Access-Control-Allow-Origin "https://bikerlink.app" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-GH-Token, Authorization" always;

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://bikerlink.app";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, X-GH-Token, Authorization";
        add_header Content-Length 0;
        return 204;
    }

    # Compatibilità con i probe legacy: health della prima area.
    location = /health {
        limit_req zone=gh_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8990/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # Health per area: pubblico, senza token.
    location ~ ^/areas/(?<area>grecia|balcani|est|iberia|arco-alpino|germania-centro|francia-benelux|ecuador)/health$ {
        limit_req zone=gh_limit burst=20 nodelay;
        proxy_pass http://$gh_target/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Route per area: il token è obbligatorio e il prefisso /areas/<area> viene tolto.
    location ~ ^/areas/(?<area>grecia|balcani|est|iberia|arco-alpino|germania-centro|francia-benelux|ecuador)/(?<gh_path>.+)$ {
        limit_req zone=gh_limit burst=30 nodelay;

        set $auth_ok "false";
        if ($http_x_gh_token = "__GH_TOKEN__")           { set $auth_ok "true"; }
        if ($http_authorization = "Bearer __GH_TOKEN__") { set $auth_ok "true"; }
        if ($auth_ok = "false") {
            return 401 '{"error":"Unauthorized. Provide X-GH-Token header."}';
        }

        proxy_pass http://$gh_target/$gh_path;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-GH-Token $http_x_gh_token;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    location / {
        return 404 '{"error":"Unknown GraphHopper area route"}';
    }

    access_log /var/log/nginx/graphhopper-access.log;
    error_log /var/log/nginx/graphhopper-error.log warn;
}
