# =============================================================================
# Nginx — Reverse Proxy GraphHopper per BikerLink
# Dominio: __DOMAIN__
# Porta interna GH:      8989 (localhost only — routing API)
# Porta health server:   8990 (localhost only — JSON con osm_date, graph_loaded)
#
# NOTA: questo file è usato come riferimento standalone.
#       setup-oracle.sh lo genera via heredoc con le variabili sostituite.
# =============================================================================

limit_req_zone $binary_remote_addr zone=gh_limit:10m rate=100r/m;
limit_req_status 429;

upstream graphhopper_backend {
    server 127.0.0.1:8989;
    keepalive 32;
}

upstream graphhopper_health {
    server 127.0.0.1:8990;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Access-Control-Allow-Origin "https://bikerlink.app" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-GH-Token, Authorization" always;

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://bikerlink.app";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, X-GH-Token, Authorization";
        add_header Content-Length 0;
        return 204;
    }

    # -----------------------------------------------------------------------
    # /health — pubblico, nessun token richiesto
    # Proxiato al health-server Python (porta 8990) che restituisce:
    # { "status": "ok", "graph_loaded": true, "osm_date": "...", "version": "9.1" }
    # -----------------------------------------------------------------------
    location = /health {
        limit_req zone=gh_limit burst=20 nodelay;
        proxy_pass http://graphhopper_health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # -----------------------------------------------------------------------
    # Tutte le altre route — token obbligatorio via X-GH-Token o Bearer
    # -----------------------------------------------------------------------
    location / {
        limit_req zone=gh_limit burst=30 nodelay;

        set $auth_ok "false";
        if ($http_x_gh_token = "__GH_TOKEN__")            { set $auth_ok "true"; }
        if ($http_authorization = "Bearer __GH_TOKEN__")  { set $auth_ok "true"; }

        if ($auth_ok = "false") {
            return 401 '{"error":"Unauthorized. Provide X-GH-Token header."}';
        }

        proxy_pass http://graphhopper_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    access_log /var/log/nginx/graphhopper-access.log;
    error_log /var/log/nginx/graphhopper-error.log warn;
}
